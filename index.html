<!DOCTYPE html>
<html lang="en">
<head>
    <title>ZeroMark - Secure Offline Markdown</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Use local copy if preferred, ensures offline availability -->
    <!-- <script src="marked.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- Catppuccin Mocha Theme --- */
        :root {
            /* Palette */
            --ctp-rosewater: #f5e0dc; --ctp-flamingo: #f2cdcd; --ctp-pink: #f5c2e7; --ctp-mauve: #cba6f7; --ctp-red: #f38ba8; --ctp-maroon: #eba0ac; --ctp-peach: #fab387; --ctp-yellow: #f9e2af; --ctp-green: #a6e3a1; --ctp-teal: #94e2d5; --ctp-sky: #89dceb; --ctp-sapphire: #74c7ec; --ctp-blue: #89b4fa; --ctp-lavender: #b4befe; --ctp-text: #cdd6f4; --ctp-subtext1: #bac2de; --ctp-subtext0: #a6adc8; --ctp-overlay2: #9399b2; --ctp-overlay1: #7f849c; --ctp-overlay0: #6c7086; --ctp-surface2: #585b70; --ctp-surface1: #45475a; --ctp-surface0: #313244; --ctp-base: #1e1e2e; --ctp-mantle: #181825; --ctp-crust: #11111b;
            /* Semantics */
            --bg-color: var(--ctp-base); --sidebar-bg: var(--ctp-mantle); --editor-bg: var(--ctp-base); --text-color: var(--ctp-text); --text-color-secondary: var(--ctp-subtext0); --text-color-subtle: var(--ctp-overlay1); --accent-color: var(--ctp-sapphire); --border-color: var(--ctp-overlay0); --hover-bg: var(--ctp-surface1); --button-bg: var(--ctp-surface0); --button-text: var(--ctp-text); --link-color: var(--ctp-blue); --code-bg: var(--ctp-surface0); --active-item-bg: var(--ctp-sapphire); --active-item-text: var(--ctp-crust); --error-color: var(--ctp-red); --success-color: var(--ctp-green); --warning-color: var(--ctp-yellow); --preview-heading-color: var(--ctp-sapphire); --preview-blockquote-border: var(--ctp-sapphire); --preview-blockquote-text: var(--ctp-overlay2); --scrollbar-thumb-bg: var(--ctp-surface1); --scrollbar-track-bg: var(--ctp-mantle); --cursor-color: var(--ctp-rosewater); --inline-code-text: var(--ctp-peach);
            --tree-line-color: var(--ctp-surface1);
            --tree-indent: 20px;
            /* Level Colors */
            --level-0-color: var(--ctp-text); --level-1-color: var(--ctp-sapphire); --level-2-color: var(--ctp-mauve); --level-3-color: var(--ctp-red); --level-4-color: var(--ctp-peach); --level-5-color: var(--ctp-green); --level-6-color: var(--ctp-teal);
            /* Search Highlight */
            --search-highlight-bg: var(--ctp-yellow);
            --search-highlight-text: var(--ctp-crust);
            /* Active Filter Highlight */
            --active-filter-tag-bg: var(--ctp-blue);
            --active-filter-tag-text: var(--ctp-crust);
        }

        /* --- Base Styles --- */
        *, *::before, *::after { box-sizing: border-box; }
        body { display: flex; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; margin: 0; height: 100vh; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; font-size: 16px; line-height: 1.5; }

        /* --- Sidebar --- */
        #sidebar {
            width: 250px; border-right: 1px solid var(--border-color); background-color: var(--sidebar-bg);
            display: flex; flex-direction: column; flex-shrink: 0; height: 100vh;
            transition: width 0.3s ease, opacity 0.3s ease, padding 0.3s ease, border 0.3s ease;
        }
        #sidebar-header {
            padding: 10px 10px 5px 15px; border-bottom: 1px solid var(--border-color);
            flex-shrink: 0; display: flex; flex-direction: column;
        }
        /* Updated Sidebar Header Buttons container */
        #sidebar-header-buttons {
            display: flex; align-items: center; flex-wrap: nowrap; /* Allow wrapping if needed */
            gap: 5px; /* Add spacing between buttons */
            margin-bottom: 8px;
        }
        #sidebar-header-buttons button {
            margin-left: 0; /* Remove default left margin */
        }
        #search-bar {
            width: 100%; padding: 5px 8px; margin-bottom: 5px;
            background-color: var(--ctp-surface0); color: var(--ctp-text); border: 1px solid var(--ctp-overlay0); border-radius: 4px; font-size: 0.9em;
        }
        #search-bar:focus { outline: none; border-color: var(--accent-color); }
        #reopen-prompt { display: none; margin-top: 8px; font-size: 0.85em; color: var(--ctp-subtext1); }


        /* === Collapsible Section Structure === */
        .sidebar-section { border-bottom: 1px solid var(--border-color); flex-shrink: 0; display: flex; flex-direction: column; }
        .sidebar-section.files { flex-grow: 1; flex-shrink: 1; border-bottom: none; min-height: 0; }
        .sidebar-section-header { display: flex; align-items: center; padding: 8px 10px 8px 15px; cursor: pointer; font-size: 0.95em; font-weight: 600; color: var(--accent-color); flex-shrink: 0; position: relative; }
        .sidebar-section-header:hover { background-color: var(--hover-bg); }
        .sidebar-section-toggle { margin-right: 8px; width: 1em; display: inline-block; text-align: center; transition: transform 0.2s ease-in-out; pointer-events: none; /* Prevent toggle icon from interfering with header click */ }
        .sidebar-section.collapsed .sidebar-section-toggle { transform: rotate(-90deg); }
        .filter-clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8em; padding: 1px 5px; background-color: var(--ctp-surface1); display: none; border-radius: 3px; z-index: 5; /* Ensure clickable */ }
        .sidebar-section-content { padding: 0; overflow: hidden; transition: max-height 0.3s ease-out, opacity 0.3s ease-out, padding 0.3s ease-out, border 0.3s ease-out; }

        /* Scrollable Content Areas */
        .sidebar-section.files .sidebar-section-content { flex-grow: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
        .sidebar-section#tags-section-container .sidebar-section-content,
        .sidebar-section#todos-section-container .sidebar-section-content { max-height: 150px; overflow-y: auto; overflow-x: hidden; }

        /* Hiding collapsed content */
        .sidebar-section.collapsed .sidebar-section-content { max-height: 0 !important; opacity: 0; overflow: hidden; padding-top: 0; padding-bottom: 0; margin-top: 0; margin-bottom: 0; border-width: 0; }

        /* --- Specific list styling --- */
        #file-list { padding: 5px 0 10px 0; }
        #tag-list { padding: 5px 10px 10px 10px; display: flex; flex-wrap: wrap; gap: 4px; }
        #todo-list { padding: 5px 10px 10px 10px; }
        #file-list p, #tag-list span.placeholder, #todo-list span.placeholder { padding: 5px 15px; font-style: italic; color: var(--text-color-subtle); font-size: 0.9em; }

        /* Tree View Styles */
        .tree-root, .tree-node-children { list-style: none; padding-left: var(--tree-indent); margin: 0; position: relative; } .tree-root { padding-left: 0; } .tree-root ul::before, .tree-node-children::before { content: ''; position: absolute; left: calc(var(--tree-indent) / 2); top: 0; bottom: 0; width: 1px; background: var(--tree-line-color); z-index: 1; } .tree-node.collapsed > .tree-node-children::before, .tree-node-children:empty::before { display: none; } .tree-node { position: relative; padding: 1px 0; } .tree-node::before { content: ''; position: absolute; left: calc(-1 * var(--tree-indent) / 2); top: 1em; width: calc(var(--tree-indent) / 2); height: 1px; background: var(--tree-line-color); z-index: 1; } .tree-root > .tree-node::before { display: none; } .tree-node:last-child::after { content: ''; position: absolute; left: calc(-1 * var(--tree-indent)); top: 1.05em; bottom: 0; width: 1px; background: var(--sidebar-bg); z-index: 1; } .node-content { display: flex; align-items: center; padding: 3px 5px; margin-right: 5px; /* Space for scrollbar */ border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9em; transition: background-color 0.15s ease, color 0.15s ease; color: var(--level-color, var(--text-color)); } .node-content:hover { background-color: var(--hover-bg); } .tree-node.active > .node-content { background-color: var(--active-item-bg); color: var(--active-item-text) !important; font-weight: 600; } .node-icon { margin-right: 6px; width: 1.3em; display: inline-block; text-align: center; flex-shrink: 0; font-size: 0.9em; color: var(--accent-color); transition: transform 0.15s ease-in-out; } .tree-node:not(.collapsed) > .node-content > .node-icon.folder-icon { transform: rotate(90deg); } .tree-node.collapsed > .tree-node-children { display: none; }
        .tree-node.filtered-out { display: none; } /* Hide filtered nodes */
        .node-content .highlight { background-color: var(--search-highlight-bg); color: var(--search-highlight-text); border-radius: 2px; padding: 0 2px; font-weight: bold; }

        /* Tag/TODO Styles */
        .tag-item { display: inline-block; background-color: var(--ctp-surface0); padding: 2px 6px; margin: 2px; border-radius: 10px; cursor: pointer; transition: background-color 0.15s ease, color 0.15s ease; color: var(--ctp-blue); font-size: 0.85em; }
        .tag-item:hover { background-color: var(--hover-bg); }
        .tag-item.active-filter {
            background-color: var(--active-filter-tag-bg);
            color: var(--active-filter-tag-text);
            font-weight: bold;
        }
        .todo-item { display: flex; align-items: flex-start; margin-bottom: 4px; padding: 2px 0;}
        .todo-item.filtered-out { display: none; } /* Hide filtered TODOs */
        .todo-item input[type="checkbox"] { margin-right: 8px; margin-top: 4px; flex-shrink: 0; accent-color: var(--ctp-mauve); cursor: pointer; }
        .todo-item label { flex-grow: 1; display: flex; align-items: center; cursor: pointer;} .todo-item-text { flex-grow: 1; font-size: 0.9em; }
        .todo-item.completed label { text-decoration: line-through; color: var(--ctp-overlay1); }
        .todo-source { font-size: 0.8em; color: var(--ctp-overlay0); margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; flex-shrink: 0; }
        .todo-item-text .highlight { background-color: var(--search-highlight-bg); color: var(--search-highlight-text); border-radius: 2px; padding: 0 2px; }


        /* --- Main Content, Editor, Preview --- */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        /* Updated Editor Controls - Save button moved */
        #editor-controls {
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; border-bottom: 1px solid var(--border-color); background-color: var(--bg-color);
        }
        #current-file-info {
             color: var(--text-color-subtle); white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; flex-grow: 1; margin-right: 10px; font-size: 0.9em;
        }
         /* Container for remaining editor buttons */
        #editor-action-buttons {
            display: flex;
            align-items: center;
        }
        /* Add margin between remaining buttons if needed */
        #editor-action-buttons button {
             margin-left: 5px;
        }
        #editor-area { flex-grow: 1; position: relative; background-color: var(--editor-bg); display: flex; overflow: hidden; } #editor, #preview { flex-grow: 1; padding: 20px; color: var(--text-color); font-size: 1rem; overflow-y: auto; line-height: 1.6; } #editor { outline: none; resize: none; font-family: 'Fira Code', Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace; white-space: pre-wrap; caret-color: var(--cursor-color); } #preview { white-space: normal; font-family: inherit; display: none; } #preview > *:first-child { margin-top: 0; } #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 { color: var(--preview-heading-color); margin-top: 1.4em; margin-bottom: 0.6em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-color);} #preview h1 { font-size: 1.8em; } #preview h2 { font-size: 1.5em; } #preview h3 { font-size: 1.3em; } #preview p { margin-bottom: 1em; } #preview a { color: var(--link-color); text-decoration: none; } #preview a:hover { text-decoration: underline; } #preview code { background-color: var(--code-bg); color: var(--inline-code-text); padding: 0.2em 0.4em; margin: 0 2px; border-radius: 3px; font-family: 'Fira Code', Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace; font-size: 0.9em; } #preview pre { background-color: var(--code-bg); padding: 15px; border-radius: 4px; overflow-x: auto; border: 1px solid var(--border-color); margin-bottom: 1em; } #preview pre code { background-color: transparent; color: var(--text-color); padding: 0; margin: 0; border-radius: 0; font-size: 0.9em; } #preview ul, #preview ol { margin-left: 25px; margin-bottom: 1em; } #preview li { margin-bottom: 0.5em; } #preview blockquote { border-left: 4px solid var(--preview-blockquote-border); margin: 1.5em 0; padding: 0.5em 1.2em; color: var(--preview-blockquote-text); background-color: var(--code-bg); } #preview blockquote > *:first-child { margin-top: 0; } #preview blockquote > *:last-child { margin-bottom: 0; } #preview table { border-collapse: collapse; width: auto; margin-bottom: 1.5em; border: 1px solid var(--border-color); } #preview th, #preview td { border: 1px solid var(--border-color); padding: 8px 12px; } #preview th { background-color: var(--code-bg); font-weight: 600; } #preview hr { border: 0; border-top: 1px solid var(--border-color); margin: 2em 0; } #preview img { max-width: 100%; height: auto; } #editor:empty:before { content: attr(placeholder); color: var(--text-color-subtle); pointer-events: none; position: absolute; top: 20px; left: 20px; font-style: italic; }


        /* General Button Styles */
        button { padding: 3px 8px; background-color: var(--button-bg); color: var(--button-text); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-size: 0.85rem; flex-shrink: 0; transition: background-color 0.15s ease; font-weight: 500; } button:hover { background-color: var(--hover-bg); } button:disabled { background-color: var(--ctp-surface0); color: var(--ctp-overlay0); cursor: not-allowed; opacity: 0.6; }
        /* Zen Mode */
        body.zen-mode #sidebar { width: 0; opacity: 0; padding-left: 0; padding-right: 0; border: none; overflow: hidden; }
        /* Scrollbars */
        ::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-track { background: var(--scrollbar-track-bg); } ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb-bg); border-radius: 5px; border: 2px solid var(--scrollbar-track-bg); } ::-webkit-scrollbar-thumb:hover { background: var(--ctp-surface2); } ::-webkit-scrollbar-corner { background: var(--scrollbar-track-bg); }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <div id="sidebar-header-buttons">
                <button id="open-folder-btn" title="Open Folder">📂 Open</button>
                <!-- ADDED New Note Button -->
                <button id="new-note-btn" title="New Note">➕ New</button>
                <!-- MOVED Save Button Here -->
                <button id="save-btn" disabled title="Save (Ctrl+S) / Save As...">💾 Save</button>
            </div>
            <input type="search" id="search-bar" placeholder="Search notes (regex)..." disabled>
             <div id="reopen-prompt">
                <span>Attempting to restore folder...</span>
            </div>
        </div>
        <!-- Sidebar sections -->
        <div class="sidebar-section files" id="files-section-container">
            <div class="sidebar-section-header" data-target="file-list-content">
                <span class="sidebar-section-toggle">▼</span>
                Files
                <button class="filter-clear-btn" id="clear-filter-btn" title="Clear active filter/search">✕ Clear</button>
            </div>
            <div class="sidebar-section-content" id="file-list-content">
                <div id="file-list"><p>No folder selected.</p></div>
            </div>
        </div>
        <div class="sidebar-section collapsed" id="tags-section-container">
            <div class="sidebar-section-header" data-target="tag-list-content"><span class="sidebar-section-toggle">▶</span> Tags</div>
            <div class="sidebar-section-content" id="tag-list-content">
                <div id="tag-list"><span class="placeholder">(No folder open)</span></div>
            </div>
        </div>
         <div class="sidebar-section collapsed" id="todos-section-container">
            <div class="sidebar-section-header" data-target="todo-list-content"><span class="sidebar-section-toggle">▶</span> TODOs</div>
            <div class="sidebar-section-content" id="todo-list-content">
                <div id="todo-list"><span class="placeholder">(No folder open)</span></div>
            </div>
        </div>
    </div>
    <div id="main-content">
        <!-- Updated editor controls: Removed Save button -->
        <div id="editor-controls">
            <div id="current-file-info">No file selected</div>
            <div id="editor-action-buttons"> <!-- Wrapper for remaining buttons -->
                <button id="toggle-focus-btn" title="Toggle Focus Mode (Show/Hide Sidebar)">🧘 Zen</button>
                <button id="toggle-view-btn" disabled title="Toggle Edit/Preview Mode">👁️‍🗨️ Toggle</button>
            </div>
        </div>
        <div id="editor-area">
            <div id="editor" contenteditable="true" spellcheck="false" placeholder="Select or create a note..."></div>
            <div id="preview"></div>
        </div>
    </div>

    <script>
        // --- Global State ---
        let directoryHandle = null;
        let currentFileHandle = null;
        let fileTree = null; // Original, complete tree structure
        let isDirty = false;
        let currentView = 'editor';
        let activeTreeNodeElement = null;
        let allTags = new Set();
        let allTodos = []; // Array of { completed, text, originalLine, fileHandle, fileName, currentIndex }
        let fileMetadata = new Map(); // Map<FileHandle, { content: string, tags: Set, todos: Array, handle: FileHandle }>
        let throttleTimer = null;
        let searchDebounceTimer = null;
        let activeFilter = { type: null, value: null }; // { type: 'tag' | 'search', value: string | RegExp }
        let isInitialized = false; // Flag to prevent premature actions

        // --- DOM Elements ---
        const sidebar = document.getElementById('sidebar');
        const openFolderBtn = document.getElementById('open-folder-btn');
        const newNoteBtn = document.getElementById('new-note-btn'); // Added
        const saveBtn = document.getElementById('save-btn'); // Still need ref, now in sidebar
        const searchBar = document.getElementById('search-bar');
        const reopenPrompt = document.getElementById('reopen-prompt');
        // Removed reopen button elements, they are no longer used
        const clearFilterBtn = document.getElementById('clear-filter-btn');
        const fileListDiv = document.getElementById('file-list');
        const tagListDiv = document.getElementById('tag-list');
        const todoListDiv = document.getElementById('todo-list');
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const currentFileInfoDiv = document.getElementById('current-file-info');
        const toggleViewBtn = document.getElementById('toggle-view-btn'); // Still in editor controls
        const toggleFocusBtn = document.getElementById('toggle-focus-btn'); // Still in editor controls

        // --- IndexedDB Constants ---
        const DB_NAME = 'ZeroMarkDB';
        const DB_VERSION = 1;
        const STORE_SETTINGS = 'settings';
        const KEY_LAST_HANDLE = 'lastDirectoryHandle';
        const KEY_ZEN_MODE = 'zenModeActive';
        let db = null; // DB connection handle

        // --- Event Listeners ---
        // Attach listeners in init() *after* basic setup and DOM ready
        function attachCoreListeners() {
            openFolderBtn.addEventListener('click', openFolder);
            newNoteBtn.addEventListener('click', handleNewNoteClick); // Added listener
            saveBtn.addEventListener('click', handleSaveClick); // Listener remains for moved button
            searchBar.addEventListener('input', handleSearchInput);
            clearFilterBtn.addEventListener('click', clearAllFilters); // Direct listener for clear button
            sidebar.addEventListener('click', handleSidebarClick); // Delegated listener for sections, tree, tags, todos
            editor.addEventListener('input', handleEditorInput);
            // Removed listener for saveBtn from editor controls (it's now in sidebar header)
            toggleViewBtn.addEventListener('click', toggleView); // Still in editor controls
            toggleFocusBtn.addEventListener('click', toggleFocusMode); // Still in editor controls
            document.addEventListener('keydown', handleGlobalKeyDown);
            editor.addEventListener('paste', handleEditorPaste);
            todoListDiv.addEventListener('change', handleTodoCheckboxChange); // Delegated for checkboxes inside todo list
            console.log("Core event listeners attached.");
        }

        function handleGlobalKeyDown(e) {
             if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                 e.preventDefault();
                 handleSaveClick(); // Still triggers save from shortcut
             }
         }

        function handleEditorPaste(e) {
             e.preventDefault();
             const text = e.clipboardData.getData('text/plain');
             // Use insertText for better compatibility and less reliance on execCommand
             const selection = window.getSelection();
             if (!selection.rangeCount) return;
             selection.deleteFromDocument();
             selection.getRangeAt(0).insertNode(document.createTextNode(text));
             selection.collapseToEnd(); // Move cursor after pasted text
             handleEditorInput(); // Ensure paste marks dirty and updates buttons
         }


        // --- Initialization ---
        async function init() {
            console.log("Initializing ZeroMark...");
            isInitialized = false; // Mark as not ready yet

            // Basic API checks
            if (!window.showDirectoryPicker || !window.FileSystemHandle || !window.indexedDB) {
                alert('Critical browser APIs (File System Access, IndexedDB) are missing or disabled. ZeroMark cannot function.');
                disableCoreFunctionality();
                return; // Stop initialization
            }

            // Marked.js check
            if (typeof marked === 'undefined') {
                console.warn("Marked.js library not found. Preview functionality will be disabled.");
                toggleViewBtn.title = "Preview unavailable (Marked.js missing)";
                toggleViewBtn.disabled = true;
            } else {
                marked.setOptions({ breaks: true, gfm: true, pedantic: false, sanitize: false });
            }

            resetEditorState(); // Set initial UI state
            setView('editor');
            renderTags(); // Render empty placeholders
            renderTodos();

            // Attach core listeners *before* potentially async DB/restore operations
            attachCoreListeners();

            // Try to open DB and restore session
            try {
                db = await openDatabase();
                console.log("Database opened successfully.");
                await loadSettings(); // Load preferences (Zen mode)
                await attemptRestoreLastFolder(); // Try to reopen folder async
            } catch (error) {
                console.error("Failed during DB initialization or folder restore:", error);
                // Non-critical error, core functionality should still work.
                // User will just need to open folder manually.
            }

            // Ensure Zen button is enabled (if not disabled by API check)
             // Check specifically if the button exists and isn't already disabled by API check
             if (toggleFocusBtn && !toggleFocusBtn.disabled) {
                 toggleFocusBtn.disabled = false;
            } else if (!toggleFocusBtn) {
                 console.warn("Toggle Focus Button not found during init enable.");
            }


            isInitialized = true; // Mark as initialized
            console.log("ZeroMark initialization sequence complete.");
        }

        function disableCoreFunctionality() {
            // Disable all major interactive elements if critical APIs are missing
            const buttonsToDisable = [openFolderBtn, newNoteBtn, saveBtn, searchBar, clearFilterBtn, toggleViewBtn, toggleFocusBtn];
            buttonsToDisable.forEach(btn => { if (btn) btn.disabled = true; });

            if (editor) {
                editor.contentEditable = false;
                editor.setAttribute('placeholder', 'Browser API Error - Cannot Load Notes');
            }
            if(fileListDiv) fileListDiv.innerHTML = '<p>Error: Missing APIs.</p>';
            if(tagListDiv) tagListDiv.innerHTML = '<span class="placeholder">(Error)</span>';
            if(todoListDiv) todoListDiv.innerHTML = '<span class="placeholder">(Error)</span>';
            console.error("Core functionality disabled due to missing browser APIs.");
        }

        // --- IndexedDB Functions ---
        function openDatabase() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) return reject("IndexedDB API not available");
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (event) => {
                    try {
                        const dbInstance = event.target.result;
                        if (!dbInstance.objectStoreNames.contains(STORE_SETTINGS)) {
                            dbInstance.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
                            console.log(`Object store '${STORE_SETTINGS}' created.`);
                        }
                    } catch (e) {
                         console.error("Error during DB upgrade:", e);
                         // Don't reject here, allow opening to potentially succeed still
                         // reject(e); // Propagate error? Maybe too harsh.
                    }
                };

                request.onsuccess = (event) => {
                    resolve(event.target.result);
                };

                request.onerror = (event) => {
                    console.error("Database open error:", event.target.error);
                    reject(event.target.error);
                };
            });
        }

        function getSetting(key) {
            return new Promise((resolve, reject) => {
                if (!db) return reject("Database not initialized");
                try {
                    const transaction = db.transaction([STORE_SETTINGS], 'readonly');
                    const store = transaction.objectStore(STORE_SETTINGS);
                    const request = store.get(key);

                    request.onsuccess = (event) => {
                        resolve(event.target.result ? event.target.result.value : undefined);
                    };
                    request.onerror = (event) => {
                        console.error(`Error getting setting '${key}':`, event.target.error);
                        reject(event.target.error);
                    };
                     transaction.onerror = (event) => { // Catch transaction errors too
                         console.error(`Read transaction error for setting '${key}':`, event.target.error);
                         // Don't reject here maybe? Just warn.
                         // reject(event.target.error);
                         resolve(undefined); // Resolve as undefined on transaction error
                     };
                     transaction.onabort = (event) => {
                        console.warn(`Read transaction aborted for setting '${key}':`, event.target.error);
                        resolve(undefined);
                    };
                } catch (e) {
                     console.error(`Error creating transaction for getSetting '${key}':`, e);
                     reject(e);
                }
            });
        }

        function saveSetting(key, value) {
            return new Promise((resolve, reject) => {
                if (!db) {
                     console.warn(`DB not available, cannot save setting '${key}'`);
                     return resolve(); // Resolve silently if DB is not available
                 }
                 try {
                    const transaction = db.transaction([STORE_SETTINGS], 'readwrite');
                    const store = transaction.objectStore(STORE_SETTINGS);
                    const request = store.put({ key, value });

                    // Use transaction events for completion/error as they are more reliable
                    transaction.oncomplete = () => {
                        // console.log(`Setting '${key}' transaction completed.`);
                        resolve();
                    };
                    transaction.onerror = (event) => {
                        console.error(`Write transaction error for setting '${key}':`, event.target.error);
                        reject(event.target.error); // Reject on transaction error
                    };
                     transaction.onabort = (event) => {
                        console.warn(`Write transaction aborted for setting '${key}':`, event.target.error);
                        reject(event.target.error); // Abort is also an error
                    };
                     // request.onsuccess/onerror might fire before transaction completes/fails fully

                 } catch (e) {
                     console.error(`Error creating transaction for saveSetting '${key}':`, e);
                     reject(e);
                 }
            });
        }

        async function loadSettings() {
             if (!db) {
                 console.warn("Cannot load settings, DB not available.");

             }
            try {

                // Ensure button exists before modifying

                }
            } catch (error) {
                console.warn("Could not load settings from DB:", error);
            }
        }

        async function attemptRestoreLastFolder() {
            if (!db) {
                 console.log("DB not available, skipping folder restore.");
                 if(reopenPrompt) reopenPrompt.style.display = 'none';
                 return;
            }
            let savedHandle = null;
            try {
                savedHandle = await getSetting(KEY_LAST_HANDLE);

                if (savedHandle && savedHandle instanceof FileSystemDirectoryHandle) {
                    console.log("Found saved directory handle. Querying permission...");
                    if(reopenPrompt) { // Check element exists
                        reopenPrompt.style.display = 'block';
                        reopenPrompt.textContent = `Checking permissions for ${savedHandle.name}...`;
                    }

                    const permissionStatus = await savedHandle.queryPermission({ mode: 'readwrite' });

                    if (permissionStatus === 'granted') {
                        console.log("Permission already granted.");
                         if(reopenPrompt) reopenPrompt.textContent = `Restoring ${savedHandle.name}...`;
                        await initializeWithHandle(savedHandle);
                         if(reopenPrompt) reopenPrompt.style.display = 'none';
                    } else if (permissionStatus === 'prompt') {
                        console.log("Permission requires prompt. Requesting...");
                         if(reopenPrompt) reopenPrompt.textContent = `Requesting access to ${savedHandle.name}...`;
                        try {
                            // Prompt user proactively
                            const userPermission = await savedHandle.requestPermission({ mode: 'readwrite' });
                            if (userPermission === 'granted') {
                                console.log("Permission granted by user.");
                                 if(reopenPrompt) reopenPrompt.textContent = `Restoring ${savedHandle.name}...`;
                                await initializeWithHandle(savedHandle);
                                 if(reopenPrompt) reopenPrompt.style.display = 'none';
                            } else {
                                console.log("User denied permission request.");
                                 if(reopenPrompt) reopenPrompt.textContent = "Permission denied. Open manually.";
                                setTimeout(() => { if(reopenPrompt) reopenPrompt.style.display = 'none'; }, 2000);
                                try { await saveSetting(KEY_LAST_HANDLE, null); } catch {}
                            }
                        } catch (requestErr) {
                             console.error("Error requesting permission:", requestErr);
                              if(reopenPrompt) reopenPrompt.textContent = "Error requesting permission.";
                             setTimeout(() => { if(reopenPrompt) reopenPrompt.style.display = 'none'; }, 2000);
                             try { await saveSetting(KEY_LAST_HANDLE, null); } catch {}
                        }
                    } else { // permissionStatus === 'denied'
                        console.log("Permission denied previously.");
                         if(reopenPrompt) reopenPrompt.textContent = `Permission for ${savedHandle.name} was denied. Open manually.`;
                        setTimeout(() => { if(reopenPrompt) reopenPrompt.style.display = 'none'; }, 2500);
                        try { await saveSetting(KEY_LAST_HANDLE, null); } catch {}
                    }
                } else {
                    console.log("No valid saved directory handle found.");
                     if(reopenPrompt) reopenPrompt.style.display = 'none';
                }
            } catch (error) {
                console.error("Error attempting to restore last folder:", error);
                 if(reopenPrompt) reopenPrompt.textContent = "Error restoring folder.";
                 setTimeout(() => { if(reopenPrompt) reopenPrompt.style.display = 'none'; }, 2000);
                if (savedHandle) { try { await saveSetting(KEY_LAST_HANDLE, null); } catch {} }
            }
        }

        // --- Folder/File Handling ---
        async function openFolder() {

            if (!isInitialized) { console.warn("Open folder called before init complete."); return; }
            try {

            } catch (err) {

        async function initializeWithHandle(handle) {
            console.log(`Initializing with handle: ${handle.name}`);
            directoryHandle = handle; // Set the global handle

            // Persist the handle in IndexedDB
            try {
                await saveSetting(KEY_LAST_HANDLE, directoryHandle);

        async function buildFileTree() {
             if (!directoryHandle) return;
             if (fileListDiv) fileListDiv.innerHTML = '<p>Building file tree...</p>';
             try {
                 fileTree = await readDirectoryRecursive(directoryHandle);
                 renderFileTreeUI(fileTree, fileListDiv);
                 console.log("File tree built and rendered.");
             } catch (error) {
                 console.error("Tree build error:", error);
                 if (fileListDiv) fileListDiv.innerHTML = `<p>Error building file tree: ${error.message}</p>`;
                 fileTree = null;
                 clearMetadata(); renderTags(); renderTodos();
                 throw error; // Re-throw to be caught by initializer
             }
         }

        async function readDirectoryRecursive(dirHandle) {
            const entries = [];
            try {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file') {
                        if (entry.name.endsWith('.md') && !entry.name.startsWith('.')) {
                            entries.push({ handle: entry, name: entry.name, type: 'file' });
                        }
                    } else if (entry.kind === 'directory') {
                        if (!entry.name.startsWith('.')) {
                            const children = await readDirectoryRecursive(entry);
                            // Pass checkSubdirs=false to only check immediate contents for pruning empty dirs
                            if (children.length > 0 || await directoryContainsMarkdown(entry, false)) {
                                entries.push({ handle: entry, name: entry.name, type: 'folder', children: children });
                            }
                        }
                    }
                }
            } catch (e) {
                 // Handle specific errors like permission denied more gracefully?
                 if (e.name === 'NotAllowedError') {
                    console.warn(`Permission denied while reading directory ${dirHandle.name}. Skipping.`);
                 } else {
                    console.error(`Error reading directory ${dirHandle.name}:`, e);
                    throw new Error(`Failed to read directory "${dirHandle.name}". Check permissions. Original error: ${e.message}`);
                 }
            }
            entries.sort((a, b) => {
                if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
                return a.name.localeCompare(b.name);
            });
            return entries;
        }

        async function directoryContainsMarkdown(dirHandle, checkSubdirs = true) {
             try {
                 for await (const entry of dirHandle.values()) {
                     if (entry.kind === 'file' && entry.name.endsWith('.md') && !entry.name.startsWith('.')) {
                         return true;
                     } else if (checkSubdirs && entry.kind === 'directory' && !entry.name.startsWith('.')) {
                         // Optimization: Don't recurse if we only need shallow check (checkSubdirs=false)
                         if (await directoryContainsMarkdown(entry, true)) { // Always check subdirs recursively here
                             return true;
                         }
                     }
                 }
             } catch (e) {
                 console.warn(`Could not check contents of ${dirHandle.name}:`, e);
                 return false; // Assume no markdown if error occurs during check
             }
             return false;
         }

        // --- UI Rendering Functions ---

        function renderFileTreeUI(nodesToRender, containerElement, filter = null) {
            if (!containerElement) { console.error("File list container not found!"); return; }
            containerElement.innerHTML = ''; // Clear previous content
            const rootUl = document.createElement('ul');
            rootUl.classList.add('tree-root');

            if (!nodesToRender || nodesToRender.length === 0) {
                 if (directoryHandle) { // Only show "No notes found" if a folder is actually open
                    containerElement.innerHTML = '<p>No markdown notes found.</p>';
                 } else {
                     containerElement.innerHTML = '<p>No folder selected.</p>';
                 }
                // Hide clear button if list is empty regardless of filter
                if (clearFilterBtn) clearFilterBtn.style.display = 'none';
                return;
            }

            let foundVisibleNodes = false;
            nodesToRender.forEach(node => {
                 if (renderSingleTreeNode(node, rootUl, 0, filter)) {
                    foundVisibleNodes = true;
                 }
            });

            if (!foundVisibleNodes && filter?.type) { // Check filter.type exists
                 containerElement.innerHTML = '<p>No matching notes found.</p>';
            } else if (foundVisibleNodes) {
                 containerElement.appendChild(rootUl);
            } else if (!filter?.type && directoryHandle) { // No filter, folder open, but nothing rendered
                 containerElement.innerHTML = '<p>No markdown notes found.</p>';
            } else if (!directoryHandle){
                 containerElement.innerHTML = '<p>No folder selected.</p>';
            }

            // Update clear filter button visibility
             if (clearFilterBtn) clearFilterBtn.style.display = filter?.type ? 'inline-block' : 'none'; // Check filter.type
        }

        function renderSingleTreeNode(node, containerUlElement, level, filter) {
             let isVisible = !filter?.type; // Assume visible if no filter *type* is set
             let selfMatches = false;
             let childrenVisible = false;

             // Filter matching logic
             if (filter?.type) {
                 if (filter.type === 'tag') {
                     const nodeMeta = fileMetadata.get(node.handle);
                     if (node.type === 'file' && nodeMeta?.tags?.has(filter.value)) {
                         isVisible = true; selfMatches = true;
                     }
                 } else if (filter.type === 'search') {
                    const regex = filter.value; // Already a RegExp object
                    if (node.name && regex.test(node.name)) { isVisible = true; selfMatches = true; }
                    if (!isVisible && node.type === 'file') { // Only check content if name didn't match
                        const nodeMeta = fileMetadata.get(node.handle);
                        if (nodeMeta?.content && regex.test(nodeMeta.content)) { isVisible = true; selfMatches = true; }
                    }
                 }
             }

            // Create list item and content div
            const nodeLiElement = document.createElement('li');
            nodeLiElement.classList.add('tree-node');
            if(node.name) nodeLiElement.dataset.name = node.name; // Use name for identification if available

            const contentElement = document.createElement('div');
            contentElement.classList.add('node-content');
            contentElement.dataset.type = node.type;
            const levelColorVar = `--level-${level % 7}-color`;
            contentElement.style.setProperty('--level-color', `var(${levelColorVar})`);

            const iconElement = document.createElement('span');
            iconElement.classList.add('node-icon');

            // Highlight filename if search matches
            let nodeDisplayName = node.name || '[Unnamed Entry]';
             if (filter?.type === 'search' && selfMatches && filter.value instanceof RegExp && filter.value.test(nodeDisplayName)) {
                 filter.value.lastIndex = 0; // Reset state for safety
                 nodeDisplayName = nodeDisplayName.replace(filter.value, '<span class="highlight">$&</span>');
             }

            // Folder specific setup
            let childrenUlElement = null;
            if (node.type === 'folder') {
                iconElement.classList.add('folder-icon');
                contentElement.dataset.handleKind = 'directory';
                childrenUlElement = document.createElement('ul');
                childrenUlElement.classList.add('tree-node-children');

                // Recursively render children and check visibility
                if (node.children?.length > 0) {
                    node.children.forEach(childNode => {
                        if (renderSingleTreeNode(childNode, childrenUlElement, level + 1, filter)) {
                            childrenVisible = true;
                        }
                    });
                }
                // Folder is visible if its name matches OR it has visible children
                 if (childrenVisible || (selfMatches && filter?.type === 'search')) {
                     isVisible = true;
                 }
            } else { // File specific setup
                iconElement.textContent = '📄';
                contentElement.dataset.handleKind = 'file';
                 if (node.handle?.name) { // Check handle and name exist
                    contentElement.dataset.fileHandleKey = node.handle.name;
                 }
            }

             // Only append the node if it's visible
            if (isVisible) {
                contentElement.appendChild(iconElement);
                const nameSpan = document.createElement('span');
                nameSpan.innerHTML = ` ${nodeDisplayName}`; // Add space before name
                contentElement.appendChild(nameSpan);
                nodeLiElement.appendChild(contentElement);

                // Set folder icon state and append children
                if (node.type === 'folder' && childrenUlElement) {
                    // Expand if filtering and children are visible, OR if it contains the active file
                    const containsActiveChild = activeTreeNodeElement && nodeLiElement.contains(activeTreeNodeElement);
                    const shouldExpand = (filter?.type && childrenVisible) || containsActiveChild;
                    nodeLiElement.classList.toggle('collapsed', !shouldExpand);
                    iconElement.textContent = shouldExpand ? '▼' : '▶';

                    // Only append children UL if there are visible children inside OR if it's expanded because it contains the active node
                    if (childrenVisible || containsActiveChild) {
                       // Ensure UL actually has children before appending
                       if (childrenUlElement.hasChildNodes()) {
                           nodeLiElement.appendChild(childrenUlElement);
                       }
                    }
                    // If folder name matches search but no children visible/active, show collapsed
                    else if (selfMatches && filter?.type === 'search') {
                       nodeLiElement.classList.add('collapsed');
                       iconElement.textContent = '▶';
                    }
                }

                // Add 'active' class if this node corresponds to the currently open file
                if (node.type === 'file' && currentFileHandle && node.handle?.name === currentFileHandle.name) {
                     nodeLiElement.classList.add('active');
                     activeTreeNodeElement = nodeLiElement;
                     // Ensure its parent folders are expanded now handled above by containsActiveChild check
                }

                containerUlElement.appendChild(nodeLiElement);
                return true; // This node (or its children) is visible
            }
            return false; // This node is not visible
        }

        function renderTags() {
            if (!tagListDiv) return;
            tagListDiv.innerHTML = ''; // Clear previous tags
            if (!directoryHandle) {
                tagListDiv.innerHTML = '<span class="placeholder">(No folder open)</span>';
                return;
            }
            if (allTags.size === 0) {
                tagListDiv.innerHTML = '<span class="placeholder">(No tags found)</span>';
                return;
            }
            const sortedTags = Array.from(allTags).sort((a, b) => a.localeCompare(b));
            sortedTags.forEach(tag => {
                const tagElement = document.createElement('span');
                tagElement.classList.add('tag-item');
                tagElement.textContent = `#${tag}`;
                tagElement.dataset.tag = tag;
                if (activeFilter.type === 'tag' && activeFilter.value === tag) {
                    tagElement.classList.add('active-filter');
                }
                tagListDiv.appendChild(tagElement);
            });
        }

        function renderTodos(filter = null) {
            if (!todoListDiv) return;
            todoListDiv.innerHTML = ''; // Clear previous TODOs
            if (!directoryHandle) {
                todoListDiv.innerHTML = '<span class="placeholder">(No folder open)</span>';
                return;
            }

            // Assign stable index *before* filtering/sorting
            allTodos.forEach((todo, index) => todo.currentIndex = index);

            // Filter based on activeFilter
            const filteredTodos = allTodos.filter(todo => {
                if (!filter?.type) return true;
                if (filter.type === 'tag') {
                     const todoMeta = fileMetadata.get(todo.fileHandle);
                     return todoMeta?.tags?.has(filter.value);
                } else if (filter.type === 'search') {
                     const regex = filter.value; // Already a RegExp
                     return (todo.text && regex.test(todo.text)) || (todo.fileName && regex.test(todo.fileName));
                }
                return true;
            });

            // Sort the filtered list
            filteredTodos.sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                const fileCompare = (a.fileName || '').localeCompare(b.fileName || '');
                if (fileCompare !== 0) return fileCompare;
                return (a.currentIndex || 0) - (b.currentIndex || 0); // Use stable index
            });

            let visibleTodos = 0;
            filteredTodos.forEach((todo) => {
                visibleTodos++;
                const todoElement = document.createElement('div');
                todoElement.classList.add('todo-item');
                if (todo.completed) todoElement.classList.add('completed');
                todoElement.dataset.todoIndex = todo.currentIndex; // Use the stable index

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.dataset.todoIndex = todo.currentIndex;

                const label = document.createElement('label');
                const textSpan = document.createElement('span');
                textSpan.classList.add('todo-item-text');

                let todoTextDisplay = todo.text || '';
                if (filter?.type === 'search' && filter.value instanceof RegExp && filter.value.test(todoTextDisplay)) {
                    filter.value.lastIndex = 0; // Reset state
                    todoTextDisplay = todoTextDisplay.replace(filter.value, '<span class="highlight">$&</span>');
                }
                textSpan.innerHTML = todoTextDisplay;

                const sourceSpan = document.createElement('span');
                sourceSpan.classList.add('todo-source');
                sourceSpan.textContent = `(${(todo.fileName || 'Unknown Source')})`;
                sourceSpan.title = todo.fileName || 'Unknown Source';

                label.appendChild(textSpan);
                label.appendChild(sourceSpan);
                todoElement.appendChild(checkbox);
                todoElement.appendChild(label);
                todoListDiv.appendChild(todoElement);
            });

            // Update placeholder text based on counts
            if (visibleTodos === 0 && allTodos.length > 0) {
                todoListDiv.innerHTML = '<span class="placeholder">(No TODOs match filter)</span>';
            } else if (allTodos.length === 0 && directoryHandle) {
                todoListDiv.innerHTML = '<span class="placeholder">(No TODOs found)</span>';
            } else if (!directoryHandle) {
                // This case handled by early return, but keep for clarity
                todoListDiv.innerHTML = '<span class="placeholder">(No folder open)</span>';
            }
        }


        // --- Sidebar Interaction ---
        function handleSidebarClick(event) {

             const todoLabel = event.target.closest('.todo-item label');
             const treeNodeContent = event.target.closest('.node-content');

                 console.log("Sidebar click ignored: Clear filter button");

                  console.log("Sidebar click: Tag item");

                  console.log("Sidebar click: Tree node");
                 handleTreeClick(treeNodeContent);

        async function handleTreeClick(contentElement) {
            const nodeLiElement = contentElement.closest('.tree-node');
            if (!nodeLiElement) return;
            const type = contentElement.dataset.type;

            if (type === 'folder') {
                const isCollapsed = nodeLiElement.classList.toggle('collapsed');

                if (icon) icon.textContent = isCollapsed ? '▶' : '▼';
            } else if (type === 'file') {
                const fileHandleKey = contentElement.dataset.fileHandleKey;
                if (!fileHandleKey) { console.error("Missing file handle key on tree node."); return; }
                const fileHandle = findHandleInTreeByKey(fileTree, fileHandleKey);

                if (fileHandle) {
                    if (isDirty && !window.confirm("Discard unsaved changes?")) { return; }
                    await loadFile(fileHandle); // loadFile handles setting activeTreeNodeElement now
                } else {
                    console.error("Could not find file handle for key:", fileHandleKey);
