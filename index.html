        async function handleTodoItemClick(todoElement) {
             if (!todoElement) return;
            const todoIndex = parseInt(todoElement.dataset.todoIndex, 10);
            if (isNaN(todoIndex)) { console.error("Invalid TODO index on element."); return; }
            // Find using stable index
            const clickedTodo = allTodos.find(todo => todo.currentIndex === todoIndex);

            if (clickedTodo?.fileHandle) {
                 if (isDirty && !window.confirm("Discard unsaved changes?")) { return; }
                 await loadFile(clickedTodo.fileHandle); // loadFile handles setting active node
                 // Ensure the loaded file node is visible in the tree
                 if(activeTreeNodeElement) {
                    activeTreeNodeElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                 }
            } else {
                console.error("Could not find data or file handle for TODO index:", todoIndex);
                alert("Error navigating to TODO source.");
            }
        }

        function handleTagClick(tagElement) {
            const tagName = tagElement.dataset.tag;
            if (!tagName) return;
            if (tagElement.classList.contains('active-filter')) {
                console.log(`Clearing tag filter: #${tagName}`);
                clearAllFilters();
            } else {
                console.log(`Filtering by tag: #${tagName}`);
                activeFilter = { type: 'tag', value: tagName };
                applyFilters();
            }
        }

        // --- Search and Filtering ---
        function handleSearchInput() {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                if (!directoryHandle) return; // Don't search if no folder open
                const searchTerm = searchBar.value.trim();
                if (searchTerm === "") {
                    clearAllFilters();
                } else {
                     try {
                        let regex;
                        const regexLiteralMatch = searchTerm.match(/^\/(.+)\/([gimyus]*)$/);
                        if (regexLiteralMatch) {
                            const flags = regexLiteralMatch[2] || 'i';
                            const finalFlags = flags.includes('i') ? flags : flags + 'i';
                            regex = new RegExp(regexLiteralMatch[1], finalFlags);
                        } else {
                             const escapedTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                             regex = new RegExp(escapedTerm, 'i');
                        }
                        console.log(`Searching with regex: ${regex}`);
                        activeFilter = { type: 'search', value: regex };
                        applyFilters();
                    } catch (e) {
                        console.error("Invalid Regex:", e.message);
                         alert(`Invalid regular expression: ${e.message}`);
                         // Clear filter but leave search term
                         activeFilter = { type: null, value: null};
                         applyFilters();
                    }
                }
            }, 300);
        }

        function applyFilters() {
             if (!directoryHandle) return;
             console.log("Applying filter:", activeFilter);

             // Update tag highlighting state
             document.querySelectorAll('#tag-list .tag-item.active-filter').forEach(el => el.classList.remove('active-filter'));
             if (activeFilter.type === 'tag') {
                  try {
                     const activeTagElement = tagListDiv.querySelector(`.tag-item[data-tag="${CSS.escape(activeFilter.value)}"]`);
                     if (activeTagElement) activeTagElement.classList.add('active-filter');
                  } catch (e) { console.error("CSS selector error for tag:", activeFilter.value, e); }
             }

            // Re-render tree and todos with the filter
            renderFileTreeUI(fileTree, fileListDiv, activeFilter);
            renderTodos(activeFilter);
             if (clearFilterBtn) clearFilterBtn.style.display = activeFilter.type ? 'inline-block' : 'none';
        }

        function clearAllFilters() {
            if (!activeFilter.type && !searchBar?.value) return; // Nothing to clear
            console.log("Clearing all filters.");
            activeFilter = { type: null, value: null };
            if (searchBar) searchBar.value = ''; // Clear search input

            document.querySelectorAll('#tag-list .tag-item.active-filter').forEach(el => el.classList.remove('active-filter'));

            // Re-render full lists only if a folder is open
             if (directoryHandle) {
                renderFileTreeUI(fileTree, fileListDiv, null);
                renderTodos(null);
             } else {
                 // Reset to initial placeholder state if no folder
                 if (fileListDiv) fileListDiv.innerHTML = '<p>No folder selected.</p>';
                 renderTags(); renderTodos();
             }

            if (clearFilterBtn) clearFilterBtn.style.display = 'none';
        }


        // --- Metadata Processing ---
         function parseFileContent(content) {
            if (typeof content !== 'string') content = ''; // Ensure content is a string
            const tags = new Set();
            const todos = [];
            // Improved tag regex to better handle nesting and avoid edge cases
            const tagRegex = /(?:^|\s)#([a-zA-Z0-9_][a-zA-Z0-9_/-]*[a-zA-Z0-9_]|[a-zA-Z][a-zA-Z0-9_]*)(?=\s|$|[,.?!:;])/g;
            let tagMatch;
            while ((tagMatch = tagRegex.exec(content)) !== null) {
                tags.add(tagMatch[1]);
            }
            const todoRegex = /^[ \t]*[-*+]\s+\[([ xX]?)]\s+(.*)/;
            const lines = content.split('\n');
             lines.forEach(line => {
                 const lineTrimmed = line.trim();
                 const match = lineTrimmed.match(todoRegex);
                 if (match) {
                     const taskText = match[2].trim();
                     const isOnlyImageLink = /^\!\[\[.*\]\]$/.test(taskText);
                     if (!isOnlyImageLink && taskText.length > 0) {
                         todos.push({ completed: match[1].toLowerCase() === 'x', text: taskText, originalLine: lineTrimmed });
                     }
                 }
             });
            return { tags, todos, content };
        }

        async function processFile(fileHandle) {
             if (!fileHandle || fileHandle.kind !== 'file') { return; }
             try {
                 const file = await fileHandle.getFile();
                 const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB limit
                 if (file.size > MAX_FILE_SIZE) {
                     console.warn(`Skipping large file ${fileHandle.name}`);
                     fileMetadata.set(fileHandle, { tags: new Set(), todos: [], content: null, handle: fileHandle }); return;
                 }
                 // Attempt to read as text, catch encoding errors
                 let content = '';
                 try {
                    content = await file.text();
                 } catch (readError) {
                      if (readError instanceof DOMException && readError.name === 'EncodingError') {
                         console.warn(`Skipping file ${fileHandle.name} due to encoding error.`);
                         fileMetadata.set(fileHandle, { tags: new Set(), todos: [], content: null, handle: fileHandle }); return;
                      } else { throw readError; } // Re-throw other read errors
                 }

                 const metadata = parseFileContent(content);
                 fileMetadata.set(fileHandle, { tags: metadata.tags, todos: metadata.todos, content: content, handle: fileHandle });
                 metadata.tags.forEach(tag => allTags.add(tag));
                 metadata.todos.forEach(todo => { allTodos.push({ ...todo, fileHandle: fileHandle, fileName: fileHandle.name }); });
             } catch (error) {
                 console.error(`Error processing file ${fileHandle.name}:`, error);
                 fileMetadata.delete(fileHandle); // Remove entry on error
             }
         }

         async function scanAllFilesForMetadata() {
             console.log("Starting metadata scan...");
             clearMetadata();
             if (!fileTree) { console.log("Scan skipped: No file tree."); renderTags(); renderTodos(); return; }
             const fileHandlesToScan = [];
             function collectFileHandlesRecursive(nodes) {
                 if (!nodes) return;
                 nodes.forEach(node => {
                     if (node.type === 'file' && node.handle) { fileHandlesToScan.push(node.handle); }
                     else if (node.type === 'folder' && node.children) { collectFileHandlesRecursive(node.children); }
                 });
             }
             collectFileHandlesRecursive(fileTree);
             if (fileHandlesToScan.length === 0) { console.log("No markdown files found."); renderTags(); renderTodos(); return; }
             console.log(`Scanning ${fileHandlesToScan.length} file(s)...`);
             // Use Promise.allSettled to process all files even if some fail
             const results = await Promise.allSettled(fileHandlesToScan.map(handle => processFile(handle)));
             results.forEach((result, index) => { if (result.status === 'rejected') { console.warn(`Processing failed for: ${fileHandlesToScan[index]?.name || 'unknown handle'}`, result.reason); } });
             console.log("Metadata scan finished.");
             renderTags();
             renderTodos();
         }

         async function updateMetadataForFile(fileHandle) {
             // More reliable update: Remove all old data for this file, then re-process it
             if (!fileHandle || !fileMetadata) return;
             console.log(`Updating metadata for ${fileHandle.name}...`);

             // Remove old TODOs for this file
             allTodos = allTodos.filter(todo => todo.fileHandle !== fileHandle);
             // Remove old metadata entry
             fileMetadata.delete(fileHandle);
             // Re-process the file to add back fresh data
             await processFile(fileHandle);

             // Rebuild the global tag list from the entire metadata map
             allTags.clear();
             for(const meta of fileMetadata.values()){
                if(meta?.tags) meta.tags.forEach(t => allTags.add(t));
             }

             console.log(`Metadata update complete for ${fileHandle.name}.`);
             // Re-render UI
             renderTags();
             renderTodos(activeFilter);
         }

         function clearMetadata() {
            allTags.clear();
            allTodos = [];
            fileMetadata.clear();
            console.log("Cleared internal metadata stores.");
        }

        // --- Tree/Handle Helpers ---
        function findHandleInTreeByKey(treeNodes, targetKey) {
             if (!treeNodes || !targetKey) return null;
             function searchNodes(nodes) {
                 if (!nodes) return null;
                 for (const node of nodes) {
                     if (node.type === 'file' && node.handle?.name === targetKey) { return node.handle; }
                     if (node.type === 'folder' && node.children) { const found = searchNodes(node.children); if (found) return found; }
                 }
                 return null;
             }
             return searchNodes(treeNodes);
         }

        function findNodeElementByKey(container, key) {
            if (!container || !key) return null;
            try {
                 // Use data-name on the LI element now for robustness
                 // const nodeLiElement = container.querySelector(`.tree-node[data-name="${CSS.escape(key)}"]`);
                 // Sticking with fileHandleKey on content for now
                 const contentElement = container.querySelector(`.node-content[data-file-handle-key="${CSS.escape(key)}"]`);
                 return contentElement ? contentElement.closest('.tree-node') : null;
            } catch (e) { console.error("CSS selector error in findNodeElementByKey:", e); return null; }
        }


        // --- Editor & File Handling ---
        async function loadFile(fileHandle) {
            if (!fileHandle || fileHandle.kind !== 'file') { console.warn("Invalid handle:", fileHandle); return; }
            if (!directoryHandle) { console.error("Cannot load file, directory handle is missing."); alert("Folder access lost. Please reopen."); return; }
            console.log(`Loading file: ${fileHandle.name}`);
            if(currentFileInfoDiv) currentFileInfoDiv.textContent = `Loading ${fileHandle.name}...`;

            try {
                 // Verify permission before reading
                 if (await directoryHandle.queryPermission({ mode: 'readwrite' }) !== 'granted') {
                     console.warn("Permission lost for directory. Requesting...");
                     if (await directoryHandle.requestPermission({ mode: 'readwrite' }) !== 'granted') { throw new Error('Permission denied.'); }
                     try { await saveSetting(KEY_LAST_HANDLE, directoryHandle); } catch {} // Resave handle
                 }

                const file = await fileHandle.getFile();
                let content = '';
                 try {
                    content = await file.text();
                 } catch (readError) {
                      if (readError instanceof DOMException && readError.name === 'EncodingError') {
                          throw new Error(`Could not read file ${fileHandle.name} (likely not text).`);
                      } else { throw readError; }
                 }


                // Update state *after* successful read
                currentFileHandle = fileHandle;
                isDirty = false; // Loading resets dirty flag

                if (editor) {
                    editor.innerText = content;
                    setView(currentView); // Ensure correct view mode
                    requestAnimationFrame(() => {
                        editor.focus({ preventScroll: true });
                        editor.scrollTop = 0; // Scroll editor to top
                    });
                }
                 if(preview && currentView === 'preview') {
                    updatePreview(); // Update preview if visible
                    preview.scrollTop = 0; // Scroll preview to top
                }


                 if (currentFileInfoDiv) currentFileInfoDiv.textContent = `${fileHandle.name}`;
                 if (saveBtn) saveBtn.disabled = true; // Disable save after load
                 if (toggleViewBtn) toggleViewBtn.disabled = editor.innerText === ''; // Disable toggle only if empty

                 // Update active state in tree AFTER successful load
                 if (activeTreeNodeElement) activeTreeNodeElement.classList.remove('active');
                 activeTreeNodeElement = findNodeElementByKey(fileListDiv, fileHandle.name);
                 if (activeTreeNodeElement) {
                      activeTreeNodeElement.classList.add('active');
                      // Ensure parents are expanded
                     let parentLi = activeTreeNodeElement.parentElement?.closest('.tree-node');
                     while(parentLi) {
                         if (parentLi.classList.contains('collapsed')) {
                             parentLi.classList.remove('collapsed');
                             const parentIcon = parentLi.querySelector('.node-icon.folder-icon');
                             if(parentIcon) parentIcon.textContent = '▼';
                         }
                         parentLi = parentLi.parentElement?.closest('.tree-node');
                     }
                 }

                console.log(`File ${fileHandle.name} loaded successfully.`);

            } catch (err) {
                console.error(`Error loading file ${fileHandle?.name}:`, err);
                alert(`Error loading file: ${err.message}.`);
                resetEditorState(); // Reset editor on load failure
            }
        }

        function handleEditorInput() {
            if (!editor) return;
            const editorHasText = editor.innerText !== '';
            const editorHasNonWhitespace = editor.innerText.trim() !== '';

            if (!isDirty) {
                 console.log("File marked as dirty.");
                 isDirty = true;
                 if(currentFileHandle && currentFileInfoDiv) currentFileInfoDiv.textContent = `${currentFileHandle.name}*`;
            }

             // Enable save button if it exists
             if (saveBtn) {
                // Enable if associated with a file OR if no file but has actual content
                saveBtn.disabled = !(currentFileHandle || editorHasNonWhitespace);
             }
             // Enable toggle button if it exists and editor has any text
             if (toggleViewBtn) {
                toggleViewBtn.disabled = !editorHasText;
             }


            // Throttle preview updates during typing
            if (currentView === 'preview' && editorHasText) {
                throttlePreviewUpdate();
            }
        }

        function throttlePreviewUpdate() {
            clearTimeout(throttleTimer);
            throttleTimer = setTimeout(() => { updatePreview(); throttleTimer = null; }, 250);
        }

        // --- UI State Changers ---
        function setFocusMode(enable) {
             document.body.classList.toggle('zen-mode', enable);
             if (toggleFocusBtn) {
                 toggleFocusBtn.textContent = enable ? '✨ Unfocus' : '🧘 Zen';
                 toggleFocusBtn.title = enable ? 'Show Sidebar' : 'Toggle Focus Mode (Zen Mode)';
             }
             saveSetting(KEY_ZEN_MODE, enable).catch(err => console.warn("Failed to save Zen mode:", err));
             window.dispatchEvent(new Event('resize')); // Trigger resize for layout adjustments
        }

        function toggleFocusMode() {
             if (!isInitialized || !toggleFocusBtn) return;
             const isZen = document.body.classList.contains('zen-mode');
             setFocusMode(!isZen);
        }

        function toggleView() {
            if (!isInitialized || !toggleViewBtn || toggleViewBtn.disabled) return;
            setView(currentView === 'editor' ? 'preview' : 'editor');
        }

        function updatePreview() {
            if (currentView !== 'preview' || !preview) return;
            if (typeof marked === 'undefined') { preview.innerHTML = `<p style="color: var(--error-color);">Preview unavailable: Marked.js not loaded.</p>`; return; }
            try {
                 if (editor) {
                     preview.innerHTML = marked.parse(editor.innerText);
                     preview.scrollTop = 0; // Scroll preview to top on update
                 }
             }
            catch (err) { console.error("Markdown parsing error:", err); preview.innerHTML = `<p style="color: var(--error-color);">Error rendering Markdown preview.</p>`; }
        }

        function setView(viewMode) {
            currentView = viewMode;
            if (!editor || !preview) return; // Ensure elements exist

            if (viewMode === 'editor') {
                editor.style.display = 'block'; preview.style.display = 'none';
                // Focus editor reasonably
                 if (document.activeElement === document.body || document.activeElement === preview || document.activeElement === toggleViewBtn) {
                      requestAnimationFrame(() => editor.focus({ preventScroll: true }));
                 }
            } else { // 'preview' mode
                updatePreview(); // Update content before showing
                editor.style.display = 'none'; preview.style.display = 'block';
            }
        }

        // --- Saving ---
        function handleSaveClick() {
            if (!isInitialized) return;
            // Check the state of the save button OR if isDirty is true (covers Ctrl+S case)
            if (saveBtn && saveBtn.disabled && !isDirty) {
                console.log("Save clicked, but nothing to save.");
                return;
            }

            if (currentFileHandle) {
                console.log("Save: Saving current file.");
                saveCurrentFile(currentFileHandle);
            } else if (editor && editor.innerText.trim() !== '') { // Check editor exists
                console.log("Save: No current file, initiating Save As.");
                saveAsNewFile();
            } else {
                console.log("Save: No file open or editor empty.");
            }
        }

        async function saveCurrentFile(fileHandleToSave) {
             if (!fileHandleToSave || !isDirty) { console.log("Save skipped: No handle or no changes."); return; }
             if (!directoryHandle) { console.error("Save failed: Directory handle lost."); alert("Save Error: Folder context lost."); return; }
             const originalName = fileHandleToSave.name;
             console.log(`Saving ${originalName}...`);
             if (currentFileInfoDiv) currentFileInfoDiv.textContent = `Saving ${originalName}...`;
             if (saveBtn) saveBtn.disabled = true; // Disable button during save

             try {
                 // Verify write permission
                 if (await directoryHandle.queryPermission({ mode: 'readwrite' }) !== 'granted') {
                     if (await directoryHandle.requestPermission({ mode: 'readwrite' }) !== 'granted') { throw new Error('Permission denied.'); }
                     try { await saveSetting(KEY_LAST_HANDLE, directoryHandle); } catch {} // Resave handle
                 }
                 // Get writable stream
                 const writable = await fileHandleToSave.createWritable();
                 // Write content (ensure editor exists)
                 const contentToSave = editor ? editor.innerText : '';
                 await writable.write(contentToSave);
                 await writable.close();

                 console.log(`Saved ${originalName}.`);
                 isDirty = false;
                 if (saveBtn) saveBtn.disabled = true; // Keep disabled after successful save
                 if (currentFileInfoDiv) currentFileInfoDiv.textContent = `${originalName}`; // Remove '*' indicator

                 await updateMetadataForFile(fileHandleToSave);

             } catch (err) {
                 console.error(`Save error (${originalName}):`, err); alert(`Error saving: ${err.message}`);
                 if (currentFileInfoDiv) currentFileInfoDiv.textContent = `Save failed: ${originalName}`;
                 // Re-enable save button only if there are still changes (isDirty should still be true)
                  if (saveBtn) saveBtn.disabled = !isDirty;
             }
        }

        async function saveAsNewFile() {
             // if (!directoryHandle) { console.warn("Save As: No directory context."); /* Allow saving anywhere */ }
             if (!editor) return; // Cannot save if editor doesn't exist
             console.log("Save As...");
             try {
                 const newFileHandle = await window.showSaveFilePicker({ suggestedName: 'Untitled.md', types: [{ description: 'Markdown Files', accept: { 'text/markdown': ['.md'] } }] });
                 console.log(`Saving as ${newFileHandle.name}...`);
                 if (currentFileInfoDiv) currentFileInfoDiv.textContent = `Saving ${newFileHandle.name}...`;
                 if (saveBtn) saveBtn.disabled = true;

                 const writable = await newFileHandle.createWritable();
                 await writable.write(editor.innerText);
                 await writable.close();

                 console.log(`Saved as ${newFileHandle.name}.`);

                 // Update application state
                 currentFileHandle = newFileHandle; isDirty = false;
                 if (saveBtn) saveBtn.disabled = true;
                 if (currentFileInfoDiv) currentFileInfoDiv.textContent = `${newFileHandle.name}`;
                 if (toggleViewBtn) toggleViewBtn.disabled = editor.innerText === '';

                 // Refresh tree if saved inside the currently open folder
                 if (directoryHandle && await isHandleInsideDirectory(newFileHandle, directoryHandle)) {
                     console.log("New file inside current directory. Refreshing...");
                     alert(`Saved ${newFileHandle.name}. Refreshing list...`);
                     await buildFileTree(); await scanAllFilesForMetadata();
                     // Activate the new node in the refreshed tree
                     const newNodeElement = findNodeElementByKey(fileListDiv, newFileHandle.name);
                     if (newNodeElement) {
                          if (activeTreeNodeElement) activeTreeNodeElement.classList.remove('active');
                          newNodeElement.classList.add('active'); activeTreeNodeElement = newNodeElement;
                          // Ensure parents expanded and scroll into view
                          let parentLi = newNodeElement.parentElement?.closest('.tree-node'); while(parentLi) { if(parentLi.classList.contains('collapsed')) parentLi.classList.remove('collapsed'); parentLi = parentLi.parentElement?.closest('.tree-node'); }
                          newNodeElement.scrollIntoView({ block: 'nearest', behavior: 'smooth'});
                     }
                 } else {
                     alert(`Saved ${newFileHandle.name}.`);
                     // If no folder was open, maybe clear the tree? Or leave as is? Leave as is for now.
                 }

             } catch (err) {
                 if (err.name === 'AbortError') { console.log("Save As cancelled."); }
                 else { console.error('Save As error:', err); alert(`Error saving: ${err.message}`); }
                 // Restore button state based on whether content exists and isDirty flag
                 if (saveBtn) saveBtn.disabled = !(isDirty && editor.innerText.trim() !== '');
                 if (currentFileInfoDiv) currentFileInfoDiv.textContent = currentFileHandle ? currentFileHandle.name : "No file selected";
                 if(isDirty && currentFileHandle && currentFileInfoDiv) currentFileInfoDiv.textContent += "*"; // Add back asterisk if still dirty
             }
        }

        async function isHandleInsideDirectory(fileHandle, dirHandle) {
             try { const path = await dirHandle.resolve(fileHandle); return path !== null; } catch (e) { return false; }
        }

        // --- TODO Handling ---
        async function handleTodoCheckboxChange(event) {
            if (event.target.type !== 'checkbox') return;
             const checkbox = event.target;
             const todoElement = checkbox.closest('.todo-item');
             if (!todoElement) return;
             const todoIndex = parseInt(checkbox.dataset.todoIndex || todoElement.dataset.todoIndex, 10);
             if (isNaN(todoIndex)) { console.error("Invalid TODO index"); return; }

             const todoItem = allTodos.find(todo => todo.currentIndex === todoIndex);
             if (!todoItem?.fileHandle || typeof todoItem.originalLine !== 'string') {
                 console.error("Cannot update TODO: Missing data", { todoIndex, todoItem });
                 checkbox.checked = !checkbox.checked; alert("Error: TODO data missing."); return;
             }

             const newCompletedState = checkbox.checked;
             const fileHandle = todoItem.fileHandle;
             const originalLineToFind = todoItem.originalLine;
             console.log(`Toggling TODO: "${todoItem.text}" in ${fileHandle.name} to ${newCompletedState}`);
             checkbox.disabled = true; todoElement.style.opacity = '0.6'; todoElement.style.pointerEvents = 'none';

             try {
                  if (!directoryHandle) throw new Error("Folder context lost.");
                  if (await directoryHandle.queryPermission({ mode: 'readwrite' }) !== 'granted') {
                      if (await directoryHandle.requestPermission({ mode: 'readwrite' }) !== 'granted') { throw new Error('Permission denied.'); }
                      try { await saveSetting(KEY_LAST_HANDLE, directoryHandle); } catch {}
                  }
                 // Read current content
                 const file = await fileHandle.getFile(); let fileContent = await file.text(); const lines = fileContent.split('\n');
                 let lineIndexToModify = -1;
                 // Find the line index
                 for (let i = 0; i < lines.length; i++) { if (lines[i].trim() === originalLineToFind) { if (/^[ \t]*[-*+]\s+\[([ xX]?)]/.test(lines[i])) { lineIndexToModify = i; break; } } }
                 if (lineIndexToModify === -1) { throw new Error(`Could not find line: "${originalLineToFind}". File may have changed.`); }

                 // Modify the line if state differs
                 const currentLine = lines[lineIndexToModify]; const currentMarkMatch = currentLine.match(/^[ \t]*[-*+]\s+\[([ xX]?)]/); const currentMark = currentMarkMatch ? currentMarkMatch[1].toLowerCase() : ''; const newMark = newCompletedState ? 'x' : ' ';
                 if (currentMark !== newMark) {
                     const leadingWhitespaceAndMarker = currentLine.match(/^[ \t]*[-*+]\s+/)[0]; lines[lineIndexToModify] = `${leadingWhitespaceAndMarker}[${newMark}] ${todoItem.text}`;
                     const updatedContent = lines.join('\n');
                     // Write back to file
                     const writable = await fileHandle.createWritable(); await writable.write(updatedContent); await writable.close();
                     console.log(`TODO updated in ${fileHandle.name}`);
                     // Update in-memory state AFTER successful save
                     todoItem.completed = newCompletedState; todoItem.originalLine = lines[lineIndexToModify].trim();
                     // Update editor/cache if necessary
                     if (currentFileHandle && currentFileHandle.name === fileHandle.name && editor) {
                          const currentScroll = editor.scrollTop; editor.innerText = updatedContent; editor.scrollTop = currentScroll;
                          isDirty = false; if (saveBtn) saveBtn.disabled = true; if (currentFileInfoDiv) currentFileInfoDiv.textContent = currentFileHandle.name;
                     } else { const cachedMeta = fileMetadata.get(fileHandle); if (cachedMeta) { cachedMeta.content = updatedContent; cachedMeta.todos = cachedMeta.todos.map(t => t.originalLine === originalLineToFind ? { ...t, completed: newCompletedState, originalLine: todoItem.originalLine } : t ); } }
                 } else { console.log("TODO state already matches."); todoItem.completed = newCompletedState; } // Ensure in-memory matches anyway
                 renderTodos(activeFilter); // Re-render UI
             } catch (error) {
                 console.error("Error updating TODO:", error); alert(`Failed to update TODO: ${error.message}`);
                 checkbox.checked = !newCompletedState; renderTodos(activeFilter); // Revert UI
             } finally {
                 // Re-enable UI elements
                 if (document.body.contains(checkbox)) checkbox.disabled = false;
                 if (document.body.contains(todoElement)) { todoElement.style.opacity = '1'; todoElement.style.pointerEvents = 'auto'; }
             }
        }

        // --- NEW FUNCTION for New Note Button ---
        function handleNewNoteClick() {
             if (!isInitialized) return;
             console.log("New Note requested.");
             if (isDirty) {
                 if (!window.confirm("Discard unsaved changes and create a new note?")) {
                     console.log("New Note cancelled."); return;
                 }
                 console.log("Discarding unsaved changes for New Note.");
             }
             // Reset editor state (clears handle, content, dirty flag, updates buttons)
             resetEditorState();
             // Focus editor
             if(editor) editor.focus();
             console.log("Editor reset for new note.");
        }


        // Updated resetEditorState to handle the relocated save button
        function resetEditorState() {
            console.log("Resetting editor state...");
             if (editor) editor.innerText = '';
             if (preview) preview.innerHTML = '';
             if (currentFileInfoDiv) currentFileInfoDiv.textContent = 'No file selected';
            currentFileHandle = null; isDirty = false;

            // Update button states
             if (saveBtn) saveBtn.disabled = true;
             if (toggleViewBtn) toggleViewBtn.disabled = true;

            // Deactivate tree node
            if (activeTreeNodeElement) { activeTreeNodeElement.classList.remove('active'); activeTreeNodeElement = null; }
            setView('editor'); // Default to editor view

             // Reset sidebar state ONLY if no folder is logically open
             if (!directoryHandle) {
                 console.log("No active directory, resetting sidebar UI.");
                 if (fileListDiv) fileListDiv.innerHTML = '<p>No folder selected.</p>';
                 if (searchBar) { searchBar.value = ''; searchBar.disabled = true; }
                 if (clearFilterBtn) clearFilterBtn.style.display = 'none';
                 activeFilter = { type: null, value: null };
                 fileTree = null; // Clear tree data
                 clearMetadata(); // Clear tags/todos/content cache
                 renderTags();    // Render empty state for tags
                 renderTodos();   // Render empty state for todos
             }
             // If a directory IS open, leave the sidebar lists (files, tags, todos) as they are.
        }


        // --- File Management (Placeholders) ---
        // These remain placeholders as requested
        async function createFile(parentDirHandle, fileName) { alert("Create file not implemented."); console.warn("createFile called but not implemented."); return null; }
        async function createFolder(parentDirHandle, folderName) { alert("Create folder not implemented."); console.warn("createFolder called but not implemented."); return null; }
        async function renameEntry(handle, newName) { alert("Rename not implemented."); console.warn("renameEntry called but not implemented."); return false; }
        async function deleteEntry(handle) { alert("Delete not implemented."); console.warn("deleteEntry called but not implemented."); return false; }


        // --- Start the Application ---
        // Use DOMContentLoaded to ensure all elements are parsed before running JS
        document.addEventListener('DOMContentLoaded', init);

    </script>
